<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <style>
    :root {
      color-scheme: dark;

      --bg: #202124;
      --surface: #303134;
      --surface-hover: #35363a;
      --border: rgba(95, 99, 104, 0.72);
      --border-strong: rgba(154, 160, 166, 0.86);

      --text: #e8eaed;
      --muted: #9aa0a6;
      --divider: rgba(95, 99, 104, 0.72);

      --accent: #8ab4f8;
      --accent-soft: rgba(138, 180, 248, 0.28);

      --hover-bg: rgba(232, 234, 237, 0.08);
      --active-bg: rgba(232, 234, 237, 0.10);
      --active-ring: rgba(232, 234, 237, 0.16);

      --shadow: 0 2px 5px rgba(0, 0, 0, 0.20);
      --shadow-hover: 0 1px 12px rgba(0, 0, 0, 0.50);
    }

    :root[data-theme="light"] {
      color-scheme: light;

      --bg: #ffffff;
      --surface: #ffffff;
      --surface-hover: #f1f3f4;
      --border: rgba(60, 64, 67, 0.28);
      --border-strong: rgba(60, 64, 67, 0.48);

      --text: #202124;
      --muted: #5f6368;
      --divider: rgba(60, 64, 67, 0.28);

      --accent: #1a73e8;
      --accent-soft: rgba(26, 115, 232, 0.16);

      --hover-bg: rgba(32, 33, 36, 0.05);
      --active-bg: rgba(32, 33, 36, 0.08);
      --active-ring: rgba(32, 33, 36, 0.14);

      --shadow: 0 1px 6px rgba(60, 64, 67, 0.28);
      --shadow-hover: 0 2px 12px rgba(60, 64, 67, 0.30);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-bottom: 80px;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 32px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-container svg {
      display: none;
      height: var(--logo-h, 48px);
      width: auto;
      max-width: 100%;
    }

    .logo-container svg.active {
      display: block;
    }

    #logo-bing-dark,
    #logo-bing-light {
      --logo-h: 80px;
    }

    #logo-google,
    #logo-google-color {
      --logo-h: 80px;
    }

    .search-wrapper {
      width: 600px;
      max-width: 90vw;
    }

    .search-container {
      display: flex;
      align-items: center;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 8px 16px;
      height: 52px;
      box-shadow: var(--shadow);
      transition:
        background-color 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }

    .search-container:hover {
      background-color: var(--surface-hover);
      border-color: var(--border-strong);
      box-shadow: var(--shadow-hover);
    }

    .search-container:focus-within {
      background-color: var(--surface-hover);
      border-color: transparent;
      box-shadow:
        var(--shadow-hover),
        0 0 0 1px var(--accent-soft);
    }

    .search-icon-left {
      width: 20px;
      height: 20px;
      margin-right: 12px;
      flex-shrink: 0;
      color: var(--muted);
    }

    .search-box {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      line-height: 24px;
      background: transparent;
      color: var(--text);
      min-width: 0;
    }

    .search-box::placeholder {
      color: var(--muted);
    }

    .search-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 12px;
      flex-shrink: 0;
    }

    .divider {
      width: 1px;
      height: 24px;
      background-color: var(--divider);
      margin-right: 2px;
      flex-shrink: 0;
    }

    .action-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      padding: 0;
      flex-shrink: 0;
      transition:
        background-color 0.18s ease,
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }

    .action-btn:hover {
      background-color: var(--hover-bg);
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .action-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .action-btn svg {
      width: 20px;
      height: 20px;
      display: block;
      transition:
        opacity 0.18s ease,
        filter 0.18s ease;
    }

    .action-btn:not(.active) svg {
      opacity: 0.75;
      filter: saturate(0.72);
    }

    .action-btn.active {
      background-color: var(--active-bg);
      box-shadow: inset 0 0 0 1px var(--active-ring);
    }

    .action-btn.active svg {
      opacity: 1;
      filter: none;
    }

    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: var(--text);
      transition:
        background-color 0.18s ease,
        transform 0.18s ease;
    }

    .theme-toggle:hover {
      background-color: var(--hover-bg);
    }

    .theme-toggle:active {
      transform: scale(0.97);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      display: none;
    }

    .theme-toggle svg.active {
      display: block;
    }

    @media (max-width: 640px) {
      .main {
        padding-bottom: 56px;
      }

      .logo-container {
        min-height: 56px;
        margin-bottom: 24px;
      }

      #logo-bing-dark,
      #logo-bing-light {
        --logo-h: 56px;
      }

      #logo-google,
      #logo-google-color {
        --logo-h: 56px;
      }

      .search-container {
        height: 48px;
        border-radius: 24px;
        padding: 6px 14px;
      }

      .search-actions {
        gap: 4px;
        margin-left: 8px;
      }

      .action-btn {
        width: 36px;
        height: 36px;
      }

      .divider {
        margin-right: 0;
      }

      .theme-toggle {
        width: 36px;
        height: 36px;
        top: 12px;
        right: 12px;
      }
    }
  </style>
</head>
